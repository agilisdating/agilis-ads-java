name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Format check, tests and Javadoc
        run: ./mvnw -B verify

  integration:
    name: Integration (Test mode)
    runs-on: ubuntu-latest
    needs: build
    env:
      AGILIS_TEST_API_KEY: ${{ secrets.AGILIS_TEST_API_KEY }}
    steps:
      - name: Check the Test key
        id: key
        run: |
          if [ -z "$AGILIS_TEST_API_KEY" ]; then
            echo "AGILIS_TEST_API_KEY is not set, so the integration tests are skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$AGILIS_TEST_API_KEY" in
            pk_live_*)
              echo "::error::AGILIS_TEST_API_KEY is a Live key. The integration tests only run with a Test key."
              exit 1
              ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.run == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration tests
        if: steps.key.outputs.run == 'true'
        run: ./mvnw -B test -Dtest.groups=integration -Dtest.excludedGroups=
